<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Heating &amp; Cooling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  FLIGHT SITES — HVAC TEMPLATE
  Do not edit this file to plug in a company. Company data lives in:
    companies/<slug>/company.js
  Open a company with:  index.html?c=<slug>
-->
<style>
:root{
  --bg:#ffffff; --bg2:#f2f2f5; --bg3:#fbfbfd;
  --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b;
  --line:rgba(0,0,0,.08);
  --accent:#0b6bcb; --accent2:#5b8cff; --accent-soft:#eaf2fc; --accent-light:#6fb1ff; --on-accent:#fff;
  --good:#1db954;
  --r-lg:32px; --r-md:24px; --r-sm:16px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08);
  --shadow-lg:0 2px 6px rgba(0,0,0,.05), 0 30px 80px rgba(0,0,0,.14);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-h:56px;
  --sec:112px;   /* section spacing: every gap between two sections' content is 2 × --sec (Website Standard → Spacing) */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
section{position:relative}
.sec{padding:var(--sec) 0}
.eyebrow{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:-.005em;margin-bottom:14px;display:block}
h1,h2,h3{letter-spacing:-.035em;line-height:1.04;font-weight:700}
h2{font-size:clamp(36px,5.2vw,60px)}
h3{font-size:24px;letter-spacing:-.022em;line-height:1.15}
.lead{font-size:clamp(18px,1.6vw,21px);color:var(--ink2);line-height:1.45;letter-spacing:-.016em;max-width:640px}
.grad{background:linear-gradient(100deg,var(--accent) 10%,var(--accent2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{text-align:center}.center .lead{margin-left:auto;margin-right:auto}

/* Section backgrounds — alternate so the page has rhythm */
.bg-gray{background:#ebebef}   /* gray sections: deep enough to read as gray on any screen, so white cards pop */
.bg-tint{background:var(--accent-soft)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 26px;border-radius:999px;font-size:17px;font-weight:600;letter-spacing:-.015em;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px -8px var(--accent)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px var(--accent)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:rgba(0,0,0,.05);color:var(--ink)}
.btn-ghost:hover{background:rgba(0,0,0,.08)}
.btn-white{background:#fff;color:var(--ink)}
.btn-glass{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn .i{font-size:18px}
.link{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

/* Nav */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{height:100%;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.03em;flex:none}
.brand img:not(.mark-img){height:42px;width:auto;max-width:190px;object-fit:contain}
.brand img.wide-logo{height:52px;max-width:250px}   /* extra-wide logos (e.g. icon + long name) */
.brand .mark-img{width:34px;height:34px;object-fit:contain;flex:none}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:-.04em}
.nav-links{display:flex;gap:28px;margin:0 auto;font-size:14px;color:var(--ink2)}
.nav-links a:hover{color:var(--ink)}
.nav-cta{display:flex;align-items:center;gap:14px;flex:none}
.nav-phone{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.nav-phone .i{color:var(--accent)}
.nav .btn{height:36px;padding:0 16px;font-size:14px}
.menu-btn{display:none;width:40px;height:40px;margin-right:-8px;align-items:center;justify-content:center;font-size:22px}
.badge247{font-size:11px;font-weight:700;letter-spacing:.02em;color:#c2410c;background:#fff1e6;padding:3px 8px;border-radius:999px}

/* Mobile menu sheet */
.sheet-menu{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(var(--nav-h) + 12px) 28px 32px;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sheet-menu.open{opacity:1;pointer-events:auto}
.sheet-menu a.big{font-size:32px;font-weight:700;letter-spacing:-.03em;padding:10px 0;transform:translateY(-8px);transition:transform .4s var(--ease)}
.sheet-menu.open a.big{transform:none}
.sheet-menu .close{position:absolute;top:8px;right:18px;width:40px;height:40px;font-size:24px;display:grid;place-items:center}
.sheet-menu .btns{margin-top:auto;display:grid;gap:10px}
.sheet-menu .btn{width:100%}

/* Hero */
.hero{padding:40px 0 64px;overflow:hidden;min-height:min(calc(100vh - var(--nav-h)), 740px);display:flex;align-items:center;background:radial-gradient(900px 600px at 85% 30%,var(--accent-soft) 0%,rgba(255,255,255,0) 65%)}
.hero .wrap{width:100%;display:grid;grid-template-columns:1.12fr 1fr;gap:56px;align-items:center}
.live{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--ink2);background:var(--bg2);padding:7px 14px 7px 12px;border-radius:999px;margin-bottom:26px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--good);opacity:.35;animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(2.2);opacity:0}}
.hero h1{font-size:clamp(48px,5.7vw,84px);letter-spacing:-.045em;line-height:.98;margin-bottom:26px}
.hero .lead{margin-bottom:36px;max-width:520px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
.svc{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px}
.svc span{font-size:14px;font-weight:600;color:var(--ink);background:var(--accent-soft);padding:7px 13px;border-radius:999px;letter-spacing:-.01em}
.live .dot.off{display:none}
.svc{flex-wrap:nowrap;overflow:hidden;max-width:100%;min-width:0}
.hero .wrap > div{min-width:0}
.svc span,.svc .svc-more{flex:none;white-space:nowrap}
.svc .svc-more{font:inherit;font-size:14px;font-weight:600;color:var(--accent);background:transparent;border:1.5px solid var(--accent-soft);padding:6px 12px;border-radius:999px;cursor:pointer}
.svc .svc-more:hover{background:var(--accent-soft)}
.svc-pop{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center}
.svc-pop.open{display:flex}
@media (min-width:700px){.svc-pop{align-items:center}}
.svc-pop .scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .38s ease}
.svc-pop.on .scrim{opacity:1}
.svc-pop .box{transform:translateY(105%);transition:transform .5s cubic-bezier(.32,.72,0,1);will-change:transform}
.svc-pop.on .box{transform:none}
@media (min-width:700px){.svc-pop .box{transform:translateY(24px) scale(.96);opacity:0;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s ease}.svc-pop.on .box{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.svc-pop .box,.svc-pop .scrim{transition:none}}
.svc-pop .box{position:relative;background:#fff;width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:24px 24px 0 0;padding:26px 24px calc(28px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg)}
@media (min-width:700px){.svc-pop .box{border-radius:24px}}
.svc-pop h3{font-size:24px;margin-bottom:6px}
.svc-pop .sub{color:var(--ink2);font-size:15px;margin-bottom:18px}
.svc-pop ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:22px}
.svc-pop li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.svc-pop li .i{color:var(--accent);flex:none}
.svc-pop .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.svc-pop .btn{width:100%}
.trust{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.trust > div{display:flex;align-items:center;gap:8px}
.trust .i{font-size:17px;color:var(--ink)}
.trust .sep{width:1px;height:18px;background:var(--line)}
.stars{display:inline-flex;gap:1px;color:#f5a623}
.stars svg{width:15px;height:15px;fill:currentColor}
.g{width:18px;height:18px}
.hero-media{position:relative}
.hero-img{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/4.6;box-shadow:var(--shadow-lg);background:var(--bg2)}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;transform:scale(1.04);animation:heroZoom 1.8s var(--ease) forwards}
@keyframes heroZoom{to{transform:scale(1)}}
/* Logo swooshes: the brand shapes from their logo, faint and slowly drifting behind the hero (opt-in, C.swooshes) */
.hero{position:relative}
.hero > .wrap{position:relative;z-index:1}
.swoosh{position:absolute;left:0;right:0;bottom:0;height:78%;width:100%;pointer-events:none;z-index:0;animation:swIn 1.6s .2s var(--ease) both}
.swoosh path{transform-box:fill-box;transform-origin:50% 50%}
.swoosh .s1{animation:swA 14s ease-in-out infinite alternate}
.swoosh .s2{animation:swB 17s ease-in-out infinite alternate}
@keyframes swIn{from{opacity:0}}
@keyframes swA{0%{transform:translate(-3%,0) scaleY(1)}100%{transform:translate(3%,-4%) scaleY(1.18)}}
@keyframes swB{0%{transform:translate(3%,2%) scaleY(1.1)}100%{transform:translate(-3%,-2%) scaleY(.9)}}
@media (max-width:760px){.swoosh{width:260%;left:-70%;right:auto;height:400px;top:40px;bottom:auto;opacity:.85}}
.float{position:absolute;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:20px;box-shadow:var(--shadow-lg);padding:16px 18px;display:flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.6)}
.float.f1{left:-36px;bottom:44px;animation:floatIn .9s .35s var(--ease) both}
.float.f2{right:-20px;top:40px;animation:floatIn .9s .55s var(--ease) both}
/* Wide hero photos (company's own landscape shots): wider frame, cards hang off the edges */
.hero.wide .hero-img{aspect-ratio:1.3/1}
.hero.wide .float.f1{left:-52px;bottom:-44px}
.hero.wide .float.f2{right:-24px;top:-28px}
@keyframes floatIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
.float .big{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.float .small{font-size:13px;color:var(--ink2);line-height:1.3}
.float .strong{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.ico-circle{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:20px;flex:none}
.ico-circle.green{background:#e8f8ee;color:#12823b}

/* Problem picker */
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:56px}
.pick{background:#fff;border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);border-radius:var(--r-md);padding:28px;text-align:left;display:flex;flex-direction:column;gap:18px;min-height:190px;transition:transform .35s var(--ease),background .35s,box-shadow .35s;position:relative}
.pick:hover{transform:translateY(-4px);background:#fff;box-shadow:var(--shadow)}
.pick .ico-circle{width:52px;height:52px;border-radius:16px;font-size:24px;background:var(--bg2)}
.pick:hover .ico-circle{background:var(--accent-soft)}
.pick h3{font-size:21px;margin-bottom:4px}
.pick p{font-size:15px;color:var(--ink2);line-height:1.4}
.pick .go{position:absolute;right:24px;top:28px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;opacity:0;transform:translateX(-6px);transition:.35s var(--ease)}
.pick:hover .go{opacity:1;transform:none}
.pick.urgent .ico-circle{color:#c2410c}

/* Stats */
.stats-sec{padding:calc(var(--sec) - 44px) 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:44px 28px 44px 0}
.stat + .stat{padding-left:28px;border-left:1px solid var(--line)}
.stat .num{white-space:nowrap;font-size:clamp(34px,4vw,52px);font-weight:700;letter-spacing:-.045em;line-height:1}
.stat .lbl{color:var(--ink2);font-size:15px;margin-top:10px;line-height:1.35}

/* Bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:64px}
.tile{background:#fff;border-radius:var(--r-lg);padding:36px;overflow:hidden;position:relative;min-height:340px;display:flex;flex-direction:column}
.tile h3{font-size:28px;letter-spacing:-.03em;margin-bottom:8px}
.tile p{color:var(--ink2);font-size:17px;line-height:1.45}
.tile.s4{grid-column:span 4}.tile.s2{grid-column:span 2}.tile.s3{grid-column:span 3}
.tile.photo{padding:0;color:#fff;min-height:520px;justify-content:flex-end}
.tile.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.tile.photo:hover img{transform:scale(1.03)}
.tile.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%)}
.tile.photo .txt{position:relative;z-index:1;padding:36px}
.tile.photo p{color:rgba(255,255,255,.85)}
.tile .viz{margin-top:auto;padding-top:28px}
.quote-card{background:var(--bg2);border-radius:18px;padding:18px 20px;font-size:15px}
.quote-card .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.quote-card .row + .row{border-top:1px solid var(--line)}
.quote-card .muted{color:var(--ink2)}
.quote-card .ok{display:flex;align-items:center;gap:8px;margin-top:12px;color:#12823b;font-weight:600;font-size:14px}
.msg{display:flex;flex-direction:column;gap:8px}
.bubble{background:#e9e9eb;border-radius:20px;padding:11px 15px;font-size:15px;line-height:1.35;max-width:88%;align-self:flex-start;border-bottom-left-radius:6px}
.bubble.me{background:var(--accent);color:#fff;align-self:flex-end;border-radius:20px;border-bottom-right-radius:6px}
.msg .meta{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:2px}
.tile.dark{background:#000;color:#fff}
.tile.dark p{color:#a1a1a6}
.plan-price{font-size:44px;font-weight:700;letter-spacing:-.04em;margin-top:6px}
.chk{list-style:none;display:grid;gap:10px;margin-top:18px}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.chk .i{color:var(--accent);font-size:18px;margin-top:2px}
.tile .bigicon{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center;font-size:30px;color:var(--accent);margin-bottom:auto}

/* Swipe hint (phones only) */
.swipe-hint{display:none;align-items:center;gap:6px;font-size:13px;color:var(--ink3);margin-top:14px}
.swipe-hint .i{font-size:14px}

/* Reviews */
.reviews{background:#fff}
.rev-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:22px}
.score .n{font-size:clamp(72px,9vw,112px);font-weight:700;letter-spacing:-.06em;line-height:.9}
.score .stars svg{width:22px;height:22px}
.rail-wrap{margin-top:56px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px max(28px,calc((100vw - 1200px)/2 + 28px)) 24px;scrollbar-width:none;scroll-padding:0 max(28px,calc((100vw - 1200px)/2 + 28px))}
.rail::-webkit-scrollbar{display:none}
.rev{flex:0 0 380px;scroll-snap-align:start;background:var(--bg2);border-radius:var(--r-md);padding:30px;display:flex;flex-direction:column;gap:18px;}
.rev p{font-size:17px;line-height:1.5;letter-spacing:-.014em}
.rev .who{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:14px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.who .nm{font-weight:600}
.who .tw{color:var(--ink2)}
.who .g{margin-left:auto}
.rail-ctrl{display:flex;gap:10px;justify-content:flex-end}
.rail-ctrl button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.06);display:grid;place-items:center;font-size:18px;transition:background .2s}
.rail-ctrl button:hover{background:rgba(0,0,0,.1)}

/* Financing (dark) */
.dark{background:#000;color:#f5f5f7}
.dark .lead{color:#a1a1a6}
.fin{display:grid;grid-template-columns:1fr 1.05fr;gap:72px;align-items:center}
.fin-price{display:flex;align-items:baseline;gap:10px;margin:36px 0 8px}
.fin-price .n{font-size:clamp(64px,7vw,88px);font-weight:700;letter-spacing:-.05em;line-height:1}
.fin-price .u{font-size:22px;color:#a1a1a6;font-weight:500}
.fin .fine{font-size:13px;color:#86868b}
.dark .chk li{font-size:17px}
.dark .chk .i{color:var(--accent-light)}
.fin-img{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:1/1.05}
.fin-img img{width:100%;height:100%;object-fit:cover}
.brands{margin-top:36px;font-size:14px;color:#86868b}
.brands b{color:#f5f5f7;font-weight:600;letter-spacing:-.01em}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:64px}
.step{padding:36px;border-radius:var(--r-lg);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px -12px rgba(0,0,0,.08)}
.step .n{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:56px;display:flex;align-items:center;gap:10px}
.step .n span{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
.step h3{margin-bottom:8px}
.step p{color:var(--ink2)}

/* Area */
.area{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.chip{padding:10px 18px;border-radius:999px;background:var(--bg2);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip .i{color:var(--accent)}
.info-card{background:var(--bg2);border-radius:var(--r-lg);padding:36px;display:grid;gap:24px}
.info-row{display:flex;gap:16px;align-items:flex-start}
.info-row .ico-circle{background:#fff}
.info-row .k{font-size:13px;color:var(--ink2)}
.info-row .v{font-size:17px;font-weight:600;letter-spacing:-.015em}

/* FAQ */
.faq{max-width:820px;margin:56px auto 0}
.faq details{border-bottom:1px solid rgba(0,0,0,.1)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;flex:none;transition:transform .35s var(--ease)}
.faq details[open]:not(.closing) .pm{transform:rotate(45deg)}
.faq .ans{overflow:hidden}
.cnt{font-variant-numeric:tabular-nums}
.faq details p{padding:0 56px 28px 0;color:var(--ink2);font-size:17px;line-height:1.55}

/* Final CTA */
.final{position:relative;min-height:640px;display:flex;align-items:center;color:#fff;overflow:hidden;margin:16px 16px 0;border-radius:var(--r-lg)}
.final img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.final::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.25) 50%,rgba(0,0,0,.6))}
.final .wrap{position:relative;z-index:1;text-align:center;width:100%}
.final h2{font-size:clamp(40px,6vw,76px);letter-spacing:-.045em}
.final .lead{color:rgba(255,255,255,.85);margin:20px auto 36px}
.final .hero-ctas{justify-content:center;margin:0}

/* Footer */
footer{padding:calc(var(--sec) * 2) 0 120px;font-size:14px;color:var(--ink2)}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid var(--line)}
.foot h4{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:14px}
.foot p,.foot a{display:block;line-height:1.9}
.foot a:hover{color:var(--ink)}
.foot a.brand{display:flex;color:var(--ink);margin-bottom:14px;line-height:1.2}
.legal{padding-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3)}

/* Sticky mobile action bar */
.actionbar{display:none}

/* Booking modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;pointer-events:none}
.modal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .35s var(--ease)}
.modal .box{position:relative;width:100%;max-width:560px;max-height:min(760px,calc(100vh - 48px));background:#fff;border-radius:28px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(24px) scale(.98);transition:.45s var(--ease)}
.modal.open{pointer-events:auto}
.modal.open .scrim{opacity:1}
.modal.open .box{opacity:1;transform:none}
.m-top{padding:20px 22px 0;display:flex;align-items:center;gap:12px}
.m-top button{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:18px;flex:none}
.m-top .back{visibility:hidden}
.m-top .back.show{visibility:visible}
.prog{flex:1;height:4px;background:var(--bg2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:25%;background:var(--accent);border-radius:4px;transition:width .5s var(--ease)}
.m-body{padding:28px 28px 8px;overflow-y:auto;flex:1}
.m-body h3{font-size:30px;letter-spacing:-.035em;margin-bottom:6px}
.m-body .sub{color:var(--ink2);margin-bottom:24px;font-size:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);text-align:left;font-weight:600;font-size:16px;letter-spacing:-.015em;transition:.2s}
.opt:hover{border-color:rgba(0,0,0,.2)}
.opt .ico-circle{width:38px;height:38px;border-radius:11px;font-size:18px;background:var(--bg2);color:var(--ink)}
.opt .d{font-weight:400;color:var(--ink2);font-size:14px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ico-circle{background:var(--accent);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 76px;padding:12px 0;border-radius:16px;border:1.5px solid var(--line);text-align:center;transition:.2s}
.day .w{font-size:12px;color:var(--ink2);font-weight:500}
.day .dn{font-size:22px;font-weight:700;letter-spacing:-.03em}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.flbl{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 10px}
.field{display:block;margin-bottom:12px}
.field input{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);padding:0 16px;font:inherit;font-size:17px;outline:none;transition:border-color .2s;background:#fff}
.field input:focus{border-color:var(--accent)}
.m-foot{padding:16px 28px 28px}
.m-foot .btn{width:100%}
.m-foot .btn[disabled]{opacity:.35;pointer-events:none}
.m-foot .note{text-align:center;font-size:13px;color:var(--ink3);margin-top:12px}
.done{text-align:center;padding:24px 0 8px}
.done .ok{width:76px;height:76px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:38px;margin:0 auto 24px;animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:none}}
.summary{background:var(--bg2);border-radius:18px;padding:6px 18px;margin-top:24px;text-align:left;font-size:15px}
.summary div{display:flex;justify-content:space-between;gap:16px;padding:12px 0}
.summary div + div{border-top:1px solid var(--line)}
.summary span:first-child{color:var(--ink2)}
.summary span:last-child{font-weight:600;text-align:right}

/* Reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}
html.shot .rv{opacity:1;transform:none;transition:none}
html.shot *,html.shot *::after{animation:none!important}
html.shot .hero-img img{transform:none}

/* ---------- Tablet ---------- */
@media (max-width:1024px){
  .nav-links{display:none}
  .hero .wrap{gap:40px}
  .picker{grid-template-columns:repeat(2,1fr)}
  .bento .tile.s4,.bento .tile.s2{grid-column:span 3}
  .bento .tile.photo{grid-column:span 6}
  .fin,.area{gap:48px}
  .foot{grid-template-columns:1fr 1fr}
}

@media (max-width:760px){

  .nav-cta{margin-left:auto}
  .menu-btn{display:flex}

  .hero .lead{font-size:17px;margin-bottom:22px}
  .svc{gap:6px;margin:-4px 0 18px}
  .svc span{font-size:13px;padding:6px 11px}
  .svc .svc-more{font-size:13px;padding:5px 10px}

  .hero-ctas{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:20px}
  .hero-ctas .btn{width:100%;height:56px}
  .trust{gap:14px;font-size:13px}
  .trust .sep{display:none}
  .hero-img{aspect-ratio:4/4.4;border-radius:28px}
  .hero.wide .hero-img{aspect-ratio:4/3}
  .hero.wide .float.f2{left:12px;right:auto;top:auto;bottom:12px}
  .float{padding:12px 14px;gap:11px;border-radius:16px}
  .float.f1{display:none}
  .float.f2{left:12px;right:auto;top:auto;bottom:12px}
  .float .big{font-size:22px}
  .float .strong{font-size:14px}
  .ico-circle{width:36px;height:36px;font-size:17px;border-radius:10px}
  .picker{gap:10px;margin-top:36px}
  .pick{padding:20px;min-height:0;gap:14px;border-radius:20px}
  .pick .ico-circle{width:44px;height:44px;font-size:21px;border-radius:13px}
  .pick h3{font-size:17px}
  .pick p{display:none}
  .pick .go{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .stats-sec{padding:calc(var(--sec) - 28px) 0}
  .stat{padding:28px 16px 28px 0}
  .stat + .stat{padding-left:16px}
  .stat:nth-child(3){padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .stat:nth-child(4){border-top:1px solid var(--line)}
  .bento{display:flex;gap:12px;margin:40px -20px 0;padding:0 20px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
  .bento::-webkit-scrollbar{display:none}
  .bento .tile{flex:0 0 84%;scroll-snap-align:start;min-height:420px;padding:28px;border-radius:28px}
  .bento .tile.photo{min-height:420px;padding:0}
  .swipe-hint{display:flex}
  .tile.photo .txt{padding:28px}
  .tile h3{font-size:24px}
  .rev{flex-basis:84vw;padding:24px}
  .reviews .rail-wrap:last-child{margin-bottom:-20px}   /* its bottom padding is shadow room, not section spacing */
  .rail{padding:4px 20px 20px;scroll-padding:0 20px}
  .rail-ctrl{display:none}
  .rail-wrap{margin-top:36px}
  .fin,.area{grid-template-columns:1fr;gap:40px}
  .steps{grid-template-columns:1fr;gap:12px;margin-top:40px}
  .step{padding:28px}
  .step .n{margin-bottom:28px}
  .info-card{padding:28px}
  .faq{margin-top:32px}
  .faq summary{font-size:17px;padding:22px 0}
  .faq details p{padding-right:0;font-size:16px}
  .final{margin:10px 10px 0;min-height:560px;border-radius:28px}
  .final .hero-ctas{display:grid;max-width:340px;margin:0 auto}
  .foot{grid-template-columns:1fr;gap:28px}
  footer{padding:calc(var(--sec) * 2) 0 130px}
  .actionbar{display:grid;grid-template-columns:auto 1fr;gap:8px;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:55;padding:8px;border-radius:24px;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 10px 40px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.7);transform:translateY(140%);transition:transform .5s var(--ease)}
  .actionbar.show{transform:none}
  .actionbar .btn{height:50px;border-radius:18px;padding:0 20px}
  .modal{padding:0;place-items:end stretch}
  /* Phone: the booking sheet fills exactly the visible screen (dvh = what's between the browser's bars), top flush with the browser bar */
  .modal .box{max-width:none;border-radius:0;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;transform:translateY(100%)}
  .m-body{padding:24px 20px 8px}
  .m-body h3{font-size:26px}
  .m-foot{padding:14px 20px calc(20px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* Brand color → accessible accent + gradient partner */
function hex2rgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))h='0b6bcb';const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}

const FONTS = {
  clean:     null,                                                                          // SF Pro / Inter. Modern, neutral (default)

  wide:      { family:'Archivo',           spec:'wdth,wght@118,700;118,800', weight:800, track:-.03, scale:.86, lh:1.08, stretch:'118%' }, // heavy, extended, industrial-modern
  condensed: { family:'Barlow Condensed',  spec:'wght@700;800',          weight:700, track:-.01,  scale:1.14, lh:.96 }, // rugged, tall, truck-lettering
  rounded:   { family:'Nunito',            spec:'wght@800;900',          weight:800, track:-.03,  scale:.98, lh:1.02 }, // friendly, soft, rounded
  modern:    { family:'Plus Jakarta Sans', spec:'wght@700;800',          weight:800, track:-.04,  scale:.96, lh:1 },    // crisp, contemporary, slightly soft
  slab:      { family:'Roboto Slab',       spec:'wght@700;800',          weight:700, track:-.03,  scale:.9,  lh:1.04 }, // sturdy, traditional, workwear
  classic:   { family:'Source Serif 4',    spec:'opsz,wght@60,700;60,800', weight:700, track:-.025, scale:.98, lh:1.04 } // established, family-heritage serif logos
};
function applyFont(key){
  const F = FONTS[key];
  if (!F) return;
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = `https://fonts.googleapis.com/css2?family=${F.family.replace(/ /g,'+')}:${F.spec}&display=swap`;
  document.head.appendChild(l);
  const f = `"${F.family}", var(--font)`, st = F.stretch ? `font-stretch:${F.stretch};` : '';
  const css = document.createElement('style');
  css.textContent = `
h1,h2,h3,.disp,.brand,.stat .num,.score .n,.plan-price,.float .big,.sheet-menu a.big{font-family:${f};font-weight:${F.weight};letter-spacing:${F.track}em;${st}}
.hero h1,.final h2{letter-spacing:${F.track}em;line-height:${F.lh}}
.hero h1{font-size:calc(clamp(48px,5.7vw,84px) * ${F.scale})}
h2{font-size:calc(clamp(36px,5.2vw,60px) * ${F.scale})}
.final h2{font-size:calc(clamp(40px,6vw,76px) * ${F.scale})}
@media (max-width:760px){ .hero h1{font-size:calc(clamp(44px,12.4vw,58px) * ${F.scale})} }
html.fw h1,html.fw h2{visibility:hidden}`;
  document.head.appendChild(css);
  // Hold the headline font briefly so it doesn't visibly swap (never longer than 800ms)
  window.__fontReady = Promise.race([
    new Promise(r => { l.onload = () => document.fonts.load(`${F.weight} 48px "${F.family}"`).then(r, r); l.onerror = r; }),
    new Promise(r => setTimeout(r, document.documentElement.classList.contains('shot') ? 6000 : 800))
  ]);
  document.documentElement.classList.add('fw');
  window.__fontReady.then(() => document.documentElement.classList.remove('fw'));
}

// Faint, slowly drifting ribbons in the colors of the swooshes/waves in their logo. Only when C.swooshes is set
// (2 colors, from the logo). Kept faint so text contrast never changes. See Website Standard → Logo elements.
function swooshes(cols){
  if (!Array.isArray(cols) || !cols.length) return '';
  const [a, b = cols[0]] = cols;
  return `<svg class="swoosh" viewBox="0 0 1440 600" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="swg1" x1="0" x2="1"><stop offset="0" stop-color="${esc(a)}" stop-opacity="0"/><stop offset=".45" stop-color="${esc(a)}" stop-opacity=".2"/><stop offset="1" stop-color="${esc(a)}" stop-opacity=".05"/></linearGradient>
      <linearGradient id="swg2" x1="0" x2="1"><stop offset="0" stop-color="${esc(b)}" stop-opacity="0"/><stop offset=".55" stop-color="${esc(b)}" stop-opacity=".2"/><stop offset="1" stop-color="${esc(b)}" stop-opacity=".04"/></linearGradient>
    </defs>
    <path class="s1" fill="url(#swg1)" d="M-120 470 C 260 210, 820 170, 1560 330 C 820 280, 300 330, -120 470 Z"/>
    <path class="s2" fill="url(#swg2)" d="M-120 560 C 330 330, 900 300, 1560 430 C 900 400, 360 430, -120 560 Z"/>
  </svg>`;
}

        <div><h4>Services</h4>${services.map(x=>`<a href="#services">${esc(x)}</a>`).join('')}</div>
        <div><h4>Service area</h4>${areas.slice(0,6).map(a=>`<p>${esc(a)}</p>`).join('')}</div>
      </div>
      <div class="legal"><span>© ${year} ${esc(C.legalName||name)}. All rights reserved.</span><span>${esc(C.license || (C.licensedInsured ? 'Licensed & insured' : ''))}</span></div>
    </div>
  </footer>

  <div class="actionbar" id="actionbar">
    <a class="btn btn-dark" href="${tel(C.phone)}">${I('phone')}Call</a>
    <button class="btn btn-primary" data-book>Book a visit</button>
  </div>

  <div class="svc-pop" id="svcPop" aria-hidden="true">
    <div class="scrim" data-svc-close></div>
    <div class="box" role="dialog" aria-modal="true" aria-label="All services">
      <button class="x" data-svc-close aria-label="Close">${I('x')}</button>
      <h3>Everything we do</h3>
      <p class="sub">${esc(name)} · ${esc(city)}</p>
      <ul>${services.map(x => `<li>${I('check')}${esc(x)}</li>`).join('')}</ul>
      <button class="btn btn-primary" data-book data-svc-close>Book a visit ${I('arrow')}</button>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="scrim" data-close></div>
    <div class="box" role="dialog" aria-modal="true" aria-label="Book a visit">
      <div class="m-top"><button class="back" id="mBack" aria-label="Back">${I('left')}</button><div class="prog"><i id="mProg"></i></div><button data-close aria-label="Close">${I('x')}</button></div>
      <div class="m-body" id="mBody"></div>
      <div class="m-foot" id="mFoot"></div>
    </div>
  </div>`;

  wire(C);
  countUp();
  faqSlide();
  const fit = () => { fitHeadline(); fitServices(); };
  fit();
  Promise.resolve(window.__fontReady).then(fit);
  document.fonts && document.fonts.ready.then(fit);
  addEventListener('resize', fit);
  const pop = document.getElementById('svcPop');
  // Slide in: show, then animate on the next frame. Slide out: animate, then hide when it finishes.
  const openPop = () => { pop.classList.add('open'); pop.setAttribute('aria-hidden', 'false'); requestAnimationFrame(() => requestAnimationFrame(() => pop.classList.add('on'))); };
  const closePop = () => { pop.classList.remove('on'); pop.setAttribute('aria-hidden', 'true');
    const box = pop.querySelector('.box'); let done = false;
    const end = () => { if (done) return; done = true; pop.classList.remove('open'); };
    box.addEventListener('transitionend', end, { once: true }); setTimeout(end, 600); };
  document.getElementById('svcMore')?.addEventListener('click', openPop);
  pop.querySelectorAll('[data-svc-close]').forEach(el => el.addEventListener('click', closePop));
  addEventListener('keydown', e => { if (e.key === 'Escape' && pop.classList.contains('on')) closePop(); });
}

// The hero headline is always exactly its two lines, whatever the font: shrink it a little until no line wraps.
function fitHeadline() {
  const h = document.querySelector('.hero h1'); if (!h) return;
  h.style.fontSize = '';
  const base = parseFloat(getComputedStyle(h).fontSize);
  const lines = () => h.offsetHeight / parseFloat(getComputedStyle(h).lineHeight);
  for (let f = base; lines() > 2.3 && f > base * .6; ) { f -= base * .03; h.style.fontSize = f + 'px'; }
}

// Service chips stay on ONE line: show the most popular ones that fit; if any don't, the last slot
// becomes "+ All services", which opens the full list (Website Standard: above-the-fold, no clutter).
function fitServices() {
  const box = document.getElementById('svc'); if (!box) return;
  const chips = [...box.querySelectorAll('span')], more = document.getElementById('svcMore');
  chips.forEach(c => c.hidden = false); if (more) more.hidden = true;
  const fits = () => box.scrollWidth <= box.clientWidth + 1;
  if (fits() || !more) return;
  more.hidden = false;
  for (let i = chips.length - 1; i > 0 && !fits(); i--) chips[i].hidden = true;
}

// Stat numbers count up from 0 when they scroll into view ("28+", "4.9★", "24/7"); "$0", "Free", "Local" stay as they are.
function countUp(){
  const els = [...document.querySelectorAll('.stat .num')];
  const still = document.documentElement.classList.contains('shot') || matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window);
  els.forEach(el => {
    const t = el.firstChild; if (!t || t.nodeType !== 3) return;
    const m = t.textContent.match(/^(\d+(?:\.\d+)?)(.*)$/); if (!m || +m[1] === 0) return;
    const to = +m[1], dec = (m[1].split('.')[1] || '').length;
    const span = document.createElement('span'); span.className = 'cnt'; span.textContent = still ? m[1] : (0).toFixed(dec);
    el.replaceChild(span, t); if (m[2]) span.after(m[2]);
    if (still) return;
    const io = new IntersectionObserver(([e]) => { if (!e.isIntersecting) return; io.disconnect();
      const t0 = performance.now(), dur = 1400;
      const step = now => { const k = Math.min((now - t0) / dur, 1), v = to * (1 - Math.pow(1 - k, 3));
        span.textContent = v.toFixed(dec); if (k < 1) requestAnimationFrame(step); else span.textContent = m[1]; };
      requestAnimationFrame(step); }, { threshold: .5 });
    io.observe(el);
  });
}

// FAQ answers slide open and closed (same easing as the booking sheet) instead of popping in.
function faqSlide(){
  const ease = getComputedStyle(document.documentElement).getPropertyValue('--ease').trim() || 'ease';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.faq details').forEach(d => {
    const ans = d.querySelector('.ans');
    d.querySelector('summary').addEventListener('click', e => {
      e.preventDefault();
      if (reduce) { d.open = !d.open; return; }
      if (ans._a) ans._a.cancel();
      const opening = !d.open || d.classList.contains('closing');   // closed, or tapped again mid-close
      if (opening) {
        d.classList.remove('closing'); d.open = true;
        ans._a = ans.animate([{ height: '0px', opacity: 0 }, { height: ans.scrollHeight + 'px', opacity: 1 }], { duration: 450, easing: ease });
        ans._a.onfinish = () => { ans._a = null; };
      } else {
        d.classList.add('closing');
        ans._a = ans.animate([{ height: ans.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 380, easing: ease, fill: 'forwards' });
        ans._a.onfinish = () => { d.open = false; d.classList.remove('closing'); ans._a.cancel(); ans._a = null; };
      }
    });
  });
}

/* ============================ BEHAVIOR ============================ */
function wire(C){
  const $ = s => document.querySelector(s);
  // Extra-wide logos get more height so the name stays readable
  document.querySelectorAll('.brand img:not(.mark-img)').forEach(im => {
    const w = () => { if (im.naturalWidth / im.naturalHeight > 3) im.classList.add('wide-logo'); };
    im.complete ? w() : im.addEventListener('load', w);
  });
  // Landscape hero photo → wide frame
  const hi = $('#heroImg');
  const fit = () => { if (hi.naturalWidth) $('.hero').classList.toggle('wide', hi.naturalWidth / hi.naturalHeight > 1.2); };
  hi.complete ? fit() : hi.addEventListener('load', fit);
  // Nav border + mobile action bar
  const nav = $('.nav'), bar = $('#actionbar'), hero = $('.hero');
  const onScroll = () => {
    nav.classList.toggle('scrolled', scrollY > 8);
    bar.classList.toggle('show', scrollY > hero.offsetHeight * .6);
  };
  addEventListener('scroll', onScroll, {passive:true}); onScroll();

  // Mobile menu
  const sheet = $('#sheet');
  $('#menuBtn').onclick = () => sheet.classList.add('open');
  $('#menuClose').onclick = () => sheet.classList.remove('open');
  sheet.querySelectorAll('a').forEach(a => a.addEventListener('click', () => sheet.classList.remove('open')));

  // Reveal on scroll
  if (!document.documentElement.classList.contains('shot') && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -8% 0px'});
    document.querySelectorAll('.rv').forEach(el => io.observe(el));
  } else document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));

  // Reviews rail
  const rail = $('#rail');
  if (rail) {
    const step = () => (rail.querySelector('.rev')?.offsetWidth || 380) + 16;
    $('#rPrev').onclick = () => rail.scrollBy({left:-step(), behavior:'smooth'});
    $('#rNext').onclick = () => rail.scrollBy({left: step(), behavior:'smooth'});
  }

  // Booking
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-book]');
    if (b){ e.preventDefault(); sheet.classList.remove('open'); openBooking(C, b.dataset.book || null); }
    if (e.target.closest('[data-close]')) closeBooking();
  });
  addEventListener('keydown', e => { if (e.key === 'Escape') closeBooking(); });
}

const BK = {step:0, issue:null, day:0, win:null, nm:'', phone:'', addr:''};
function openBooking(C, issue){
  Object.assign(BK, {step: issue ? 1 : 0, issue: issue || null, day:0, win:null});
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  drawBooking(C);
}
function closeBooking(){
  document.getElementById('modal')?.classList.remove('open');
  document.body.style.overflow = '';
}
function drawBooking(C){
  const body = document.getElementById('mBody'), foot = document.getElementById('mFoot');
  const back = document.getElementById('mBack'), prog = document.getElementById('mProg');
  const ISS = window.__ISSUES;
  prog.style.width = ((BK.step + 1) / 4 * 100) + '%';
  back.classList.toggle('show', BK.step > 0 && BK.step < 3);
  back.onclick = () => { BK.step--; drawBooking(C); };
  const days = [...Array(7)].map((_,i) => { const d = new Date(); d.setDate(d.getDate()+i); return d; });
  const wd = d => d.toLocaleDateString('en-US',{weekday:'short'});
  const WINS = [{k:'m',t:'Morning',d:'8 AM – 12 PM'},{k:'a',t:'Afternoon',d:'12 – 4 PM'},{k:'e',t:'Evening',d:'4 – 7 PM'}];
  const next = (ok, label='Continue') => `<button class="btn btn-primary" id="mNext" ${ok?'':'disabled'}>${label}</button>`;

  if (BK.step === 0){
    body.innerHTML = `<h3>What’s going on?</h3><p class="sub">Pick the closest match. Your tech will confirm on arrival.</p>
      <div class="opts">${ISS.map(x=>`<button class="opt ${BK.issue===x.k?'sel':''}" data-k="${x.k}"><span class="ico-circle">${I(x.ic)}</span><span>${x.t}<div class="d">${x.d}</div></span></button>`).join('')}</div>`;
    foot.innerHTML = next(!!BK.issue);
    body.querySelectorAll('.opt').forEach(o => o.onclick = () => { BK.issue = o.dataset.k; BK.step = 1; drawBooking(C); });
  }
  if (BK.step === 1){
    const it = ISS.find(x=>x.k===BK.issue);
    body.innerHTML = `<h3>When works best?</h3><p class="sub">${it?it.t+' · ':''}Pick the time that works best. We’ll confirm it with you.</p>
      <div class="flbl">Day</div>
      <div class="days">${days.map((d,i)=>`<button class="day ${BK.day===i?'sel':''}" data-i="${i}"><div class="w">${i===0?'Today':i===1?'Tmrw':wd(d)}</div><div class="dn">${d.getDate()}</div></button>`).join('')}</div>
      <div class="flbl">Arrival window</div>
      <div class="opts">${WINS.map(w=>`<button class="opt ${BK.win===w.k?'sel':''}" data-w="${w.k}"><span class="ico-circle">${I('clock')}</span><span>${w.t}<div class="d">${w.d}</div></span></button>`).join('')}
      ${C.emergency247?`<button class="opt ${BK.win==='asap'?'sel':''}" data-w="asap"><span class="ico-circle" style="color:#c2410c">${I('bolt')}</span><span>Emergency, ASAP<div class="d">Next available technician, 24/7</div></span></button>`:''}</div>`;
    foot.innerHTML = next(!!BK.win);
    body.querySelectorAll('.day').forEach(o => o.onclick = () => { BK.day = +o.dataset.i; drawBooking(C); });
    body.querySelectorAll('[data-w]').forEach(o => o.onclick = () => { BK.win = o.dataset.w; drawBooking(C); });
  }
  if (BK.step === 2){
    body.innerHTML = `<h3>Where should we come?</h3><p class="sub">${esc(name)} will confirm your visit.</p>
      <label class="field"><input id="fN" placeholder="Full name" autocomplete="name" value="${esc(BK.nm)}"></label>
      <label class="field"><input id="fP" placeholder="Mobile number" type="tel" autocomplete="tel" value="${esc(BK.phone)}"></label>
      <label class="field"><input id="fA" placeholder="Street address" autocomplete="street-address" value="${esc(BK.addr)}"></label>`;
    foot.innerHTML = next(false, 'Confirm booking') + `<div class="note">No payment needed to book.</div>`;
    const v = id => document.getElementById(id).value.trim();
    const chk = () => { BK.nm = v("fN"); BK.phone = v("fP"); BK.addr = v("fA"); document.getElementById('mNext').disabled = !(BK.nm && BK.phone.replace(/\D/g,'').length >= 7 && BK.addr); };
    ['fN','fP','fA'].forEach(id => document.getElementById(id).addEventListener('input', chk)); chk();
  }
  if (BK.step === 3){
    const it = ISS.find(x=>x.k===BK.issue), d = days[BK.day];
    const w = BK.win==='asap' ? 'ASAP (emergency)' : WINS.find(x=>x.k===BK.win)?.d;
    body.innerHTML = `<div class="done"><div class="ok">${I('check')}</div><h3>You’re booked${BK.nm?', '+esc(BK.nm.split(' ')[0]):''}.</h3><p class="sub" style="margin:8px 0 0">We’ll text you when your technician is on the way.</p>
      <div class="summary"><div><span>Service</span><span>${it?it.t:'Visit'}</span></div><div><span>When</span><span>${BK.win==='asap'?'Right away':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})+', '+w}</span></div><div><span>Where</span><span>${esc(BK.addr)}</span></div></div></div>`;
    foot.innerHTML = `<button class="btn btn-ghost" data-close>Done</button><div class="note">Questions? Call <a href="${tel(C.phone)}" style="color:var(--accent)">${esc(C.phone)}</a></div>`;
  }
  const n = document.getElementById('mNext');
  if (n) n.onclick = () => { BK.step++; drawBooking(C); };
  body.scrollTop = 0;
}
</script>
</body>
